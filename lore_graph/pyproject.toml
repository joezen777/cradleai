[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cradle-lore-mcp"
version = "0.1.0"
description = "Local source-grounded MCP server for Unsouled and Soulsmith"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.2",
  "bitsandbytes>=0.45",
  "fastapi>=0.116,<1",
  "mcp[cli]>=1.20,<2",
  "pillow>=11,<13",
  "real-ladybug==0.15.3",
  "sentence-transformers>=5,<6",
  "transformers>=4.57,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
cradle-lore-mcp = "lore_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lore_api", "loredb"]

[tool.hatch.build.targets.wheel.force-include]
"config.json" = "config.json"
"data/books.jsonl" = "data/books.jsonl"
"data/chapter_treatments.jsonl" = "data/chapter_treatments.jsonl"
"data/chapters.jsonl" = "data/chapters.jsonl"
"data/character_aliases.jsonl" = "data/character_aliases.jsonl"
"data/graph_counts.json" = "data/graph_counts.json"
"data/lore.lbdb" = "data/lore.lbdb"
"data/passage_embeddings.jsonl" = "data/passage_embeddings.jsonl"
"data/passage_extractions.jsonl" = "data/passage_extractions.jsonl"
"data/passages.jsonl" = "data/passages.jsonl"
"data/processing_complete.json" = "data/processing_complete.json"
"data/service_index.json" = "data/service_index.json"
"output/cast.jsonl" = "output/cast.jsonl"
"output/chapter_treatments.jsonl" = "output/chapter_treatments.jsonl"
"output/props_wardrobe.jsonl" = "output/props_wardrobe.jsonl"
"output/settings.jsonl" = "output/settings.jsonl"

[tool.hatch.build.targets.sdist]
include = [
  "lore_api",
  "loredb",
  "config.json",
  "data/books.jsonl",
  "data/chapter_treatments.jsonl",
  "data/chapters.jsonl",
  "data/character_aliases.jsonl",
  "data/graph_counts.json",
  "data/lore.lbdb",
  "data/passage_embeddings.jsonl",
  "data/passage_extractions.jsonl",
  "data/passages.jsonl",
  "data/processing_complete.json",
  "data/service_index.json",
  "output/*.jsonl",
  "README.md",
]
