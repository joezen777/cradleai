version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix frontend ci
    build:
      commands:
        - npm --prefix frontend run build:static
        - cd frontend && node scripts/prepare-amplify-artifact.mjs amplify-artifact
  artifacts:
    baseDirectory: frontend/amplify-artifact
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
